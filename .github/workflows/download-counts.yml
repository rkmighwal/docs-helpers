# Keeps one download-count badge file per tool on the `badges` branch, for the README badges.
# Counts downloads of release files only (see .github/scripts/download-counts.mjs).
name: Download counts

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the counter
        run: node --test .github/scripts/download-counts.test.mjs

      - name: Count downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/download-counts.mjs "$RUNNER_TEMP/badges"

      - name: Publish the badge files
        run: |
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Download counts"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
